<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caramujo Vision</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- os visuais: linhas de painéis, montadas pelo app.js -->
<div id="grid"></div>

<!-- pós-produção: UMA passada por cima de todos os painéis (js/fx.js) -->
<canvas id="fx"></canvas>

<!-- barra de ferramentas: aparece quando o mouse entra na janela -->
<div id="toolbar" role="toolbar" aria-label="Caramujo Vision">
  <div class="tb-grab" title="Arraste pra mover a janela"><span class="logo"></span></div>
  <button class="tb-preset" id="tbPreset" title="Presets: conjuntos prontos de visuais"><span class="tb-name">Barra</span><span class="tb-dirty"></span><i data-ic="chev"></i></button>
  <span class="tb-sep"></span>
  <button id="tbTheme" title="Tema (T troca)"><i data-ic="theme"></i></button>
  <button id="tbPos" title="Posição da janela"><i data-ic="pos-bottom"></i></button>
  <button id="tbPin" title="Sempre na frente"><i data-ic="pin"></i></button>
  <button id="tbPause" title="Pausar (P)"><i data-ic="pause"></i></button>
  <button id="tbSettings" title="Ajustes (S)"><i data-ic="sliders"></i></button>
  <button id="tbMore" title="Mais"><i data-ic="dots"></i></button>
  <span class="tb-sep win"></span>
  <button id="tbMin" class="win" title="Minimizar"><i data-ic="min"></i></button>
  <button id="tbClose" class="win quit" title="Fechar o app"><i data-ic="close"></i></button>
</div>

<!-- ajustes: folha no rodapé. Na barra encaixada a janela cresce pra ela caber -->
<div id="settings" aria-label="Ajustes">
  <nav id="settabs">
    <button data-tab="visuais">Visuais</button>
    <button data-tab="aparencia">Aparência</button>
    <button data-tab="janela">Janela</button>
    <button data-tab="audio">Áudio</button>
    <button data-tab="gravacao">Gravação</button>
    <button data-tab="atalhos">Atalhos</button>
    <span class="grow"></span>
    <button id="setclose" title="Fechar (Esc)">Fechar</button>
  </nav>
  <div id="setbody"></div>
</div>

<!-- menu suspenso e menu de contexto (um só elemento, reaproveitado) -->
<div id="menu" class="hidden" role="menu"></div>

<!-- caixinha de nome (o Electron não tem window.prompt) -->
<div id="ask" class="hidden">
  <div class="askbox">
    <label id="asklabel">Nome do preset</label>
    <input id="askinput" type="text" autocomplete="off" spellcheck="false" maxlength="40">
    <div class="askrow">
      <button id="askcancel">Cancelar</button>
      <button id="askok">Salvar</button>
    </div>
  </div>
</div>

<!-- sem áudio / silêncio: aviso discreto no meio da tela -->
<div id="empty" class="hidden">
  <p id="emptymsg">Sem áudio chegando</p>
  <button id="emptybtn">Ajustes de áudio</button>
</div>

<!-- avisos curtos -->
<div id="toast"></div>

<!-- contador de fps e de atraso do som (tecla F) -->
<div id="hud"></div>

<script src="js/audio.js"></script>
<script src="js/modules.js"></script>
<script src="js/fx.js"></script>
<script src="js/app.js"></script>
</body>
</html>
